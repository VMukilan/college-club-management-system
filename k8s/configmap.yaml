# ==============================================================================
# ConfigMap – College Club Management System (v0.5)
# Stores non-sensitive application runtime configuration
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: college-club-config
  namespace: college-club
  labels:
    app.kubernetes.io/name: college-club-app
    app.kubernetes.io/part-of: college-club-management-system
data:
  FLASK_ENV: "production"
  DATABASE_NAME: "college_club.db"
  PORT: "5000"
  FLASK_HOST: "0.0.0.0"
  FLASK_DEBUG: "0"
