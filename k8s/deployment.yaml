# ==============================================================================
# Deployment – College Club Management System (v0.5)
# Security Standard: Kubernetes Pod Security Standards Restricted Profile
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-club-deployment
  namespace: college-club
  labels:
    app.kubernetes.io/name: college-club-app
    app.kubernetes.io/part-of: college-club-management-system
    app.kubernetes.io/version: v0.5
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: college-club-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: college-club-app
        app.kubernetes.io/version: v0.5
    spec:
      serviceAccountName: college-club-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: college-club-app
          image: college-club-app:v0.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: college-club-config
            - secretRef:
                name: college-club-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /login
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /login
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: instance-data
              mountPath: /app/instance
      volumes:
        - name: instance-data
          persistentVolumeClaim:
            claimName: college-club-pvc
