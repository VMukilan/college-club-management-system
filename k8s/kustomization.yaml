# ==============================================================================
# Kustomization – College Club Management System (v0.5)
# Declarative deployment bundling for Kubernetes cluster rollout
# Usage: kubectl apply -k k8s/
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: college-club

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/part-of: college-club-management-system
  app.kubernetes.io/version: v0.5
