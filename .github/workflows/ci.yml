name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Quality & Linting (flake8)
      run: |
        # Run linting and report statistics (exit-zero in v0.1 to allow baseline metric recording)
        flake8 app/ --statistics --exit-zero

    - name: Run Unit & Functional Tests (pytest)
      run: |
        python -m pytest -v

    - name: Static Application Security Testing (Bandit)
      run: |
        # Scan for Python security vulnerabilities (report findings in v0.1)
        bandit -r app/ -f txt || true

    - name: Software Composition Analysis (pip-audit)
      run: |
        # Scan dependencies for known CVEs
        pip-audit -r requirements.txt || true

    - name: Build Verification
      run: |
        python -c "import app; print('Application package loaded successfully.')"
