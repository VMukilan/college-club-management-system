# ==============================================================================
# GitHub Actions CI/CD Pipeline – College Club Management System (v0.6)
# Course: 24CYS401 – Secure Software Engineering
# Security Gates:
#   - Quality: Flake8 (0 violations)
#   - SAST: Bandit & Semgrep (0 findings)
#   - SCA: pip-audit (0 known vulnerabilities)
#   - Dynamic Testing: Pytest (Functional, Security Scenarios, K8s compliance)
#   - Fuzz Testing: Hypothesis property-based fuzzing & mutation probing
#   - Container: Docker build verification
#   - Orchestration: Kubernetes manifest validation
# ==============================================================================

name: CI/CD Security & Quality Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-quality:
    name: Code Quality & Style Gate (Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.4.1

      - name: Execute Flake8 Linting Gate
        run: |
          python -m flake8 run.py app/ tests/ --statistics --show-source

  security-scans:
    name: Automated Security Testing Gate (SAST & SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install SAST & SCA Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.9.4 pip-audit==2.10.1 semgrep==1.179.0

      - name: Run Bandit SAST Scan
        run: |
          python -m bandit -r app/ -ll

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan --config auto app/ --error

      - name: Run pip-audit SCA Vulnerability Scan
        run: |
          python -m pip_audit -r requirements.txt

  test-and-fuzz:
    name: Functional, Security & Fuzz Testing Gate
    runs-on: ubuntu-latest
    needs: [lint-and-quality, security-scans]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Execute Pytest Suite with Fuzz Tests
        run: |
          python -m pytest -v --cov=app --cov-report=term-missing tests/

  container-verification:
    name: Docker Container Build Verification Gate
    runs-on: ubuntu-latest
    needs: [test-and-fuzz]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: college-club-app:${{ github.sha }}

  k8s-manifest-validation:
    name: Kubernetes Manifest Security Validation Gate
    runs-on: ubuntu-latest
    needs: [test-and-fuzz]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Kubernetes YAML Manifests
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML==6.0.2 pytest==9.1.1
          python -m pytest -v tests/test_k8s.py
